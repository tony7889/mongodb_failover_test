[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mongodb-failover-test"
version = "0.1.0"
description = "Client-side MongoDB replica-set failover test harness and FastAPI service"
requires-python = ">=3.10"
dependencies = [
  "pymongo>=4.9,<5",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
mongodb-failover = "failover_test.cli:main"

[tool.setuptools.packages.find]
where = ["."]
